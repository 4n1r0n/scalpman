name: Release 0.1
on:
  push:
    paths:
      - ".github/workflows/release-0.1.yml"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v0.1 already exists"
            exit 0
          fi
          gh release create v0.1 \
            --repo "${{ github.repository }}" \
            --target 3271dcbd76fe80167c106f54574f0c7d2ed47f11 \
            --title "0.1" \
            --notes-file - <<'EOF'
First version of Opposing Tick Zones.

On a 1 hour trend, mark the highest tick of the lowest bar (demand) and the lowest tick of the highest bar (supply). Whichever area price hits first is the side. Enter after that area holds and price comes back to the tick. A long stop goes below demand and the target is the high. A short stop goes above supply and the target is the low. A print beyond either extreme cancels the setup.

Credit: How To Find PERFECT Entries by TradingLab, https://www.youtube.com/shorts/tS9o8aQjADY
EOF
